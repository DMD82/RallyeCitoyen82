<script>
let ateliersData = [];
let sortAteliers = 'num';
let maxPassages = 1;

document.addEventListener('DOMContentLoaded', () => {
  chargerPassages();
});

async function chargerPassages() {
  try {
    afficherChargement(true);

    const data = await apiGet('getPassages');

    ateliersData = Array.isArray(data.ateliers) ? data.ateliers : [];
    maxPassages = Math.max(...ateliersData.map(a => Number(a.passages) || 0), 1);

    afficherChargement(false);
    filtrerAteliers();

  } catch (e) {
    afficherChargement(false);
    document.getElementById('bodyAteliers').innerHTML = `
      <div class="state-box">
        <div class="state-icon">❌</div>
        <div class="state-title">Erreur de chargement</div>
        <div class="state-desc">${e.message}</div>
      </div>`;
    toast('Erreur passages : ' + e.message, 'err');
  }
}

function afficherChargement(show) {
  const overlay = document.getElementById('loadingOverlay');
  if (!overlay) return;
  overlay.classList.toggle('hidden', !show);
}

function trierAteliers(col) {
  sortAteliers = col;

  document.querySelectorAll('#panel-ateliers .sort-btn').forEach(b => {
    b.classList.remove('active');
  });

  const btn = document.getElementById('sort-atel-' + col);
  if (btn) btn.classList.add('active');

  filtrerAteliers();
}

function filtrerAteliers() {
  const input = document.getElementById('searchAteliers');
  const search = input ? input.value.toLowerCase().trim() : '';

  let data = ateliersData.filter(a => {
    const num = String(a.numAtelier || '').toLowerCase();
    const nom = String(a.nomAtelier || '').toLowerCase();
    return !search || num.includes(search) || nom.includes(search);
  });

  if (sortAteliers === 'passages') {
    data.sort((a, b) =>
      (Number(b.passages) || 0) - (Number(a.passages) || 0)
      || (Number(a.numAtelier) || 0) - (Number(b.numAtelier) || 0)
    );
  } else {
    data.sort((a, b) =>
      (Number(a.numAtelier) || 0) - (Number(b.numAtelier) || 0)
    );
  }

  renderAteliers(data);
}

function renderAteliers(data) {
  document.getElementById('cntAteliers').textContent = data.length;
  document.getElementById('statAteliers').textContent =
    data.length + ' atelier' + (data.length > 1 ? 's' : '');

  if (!data.length) {
    document.getElementById('bodyAteliers').innerHTML =
      '<div class="state-box"><div class="state-desc">Aucun atelier.</div></div>';
    return;
  }

  const total = data.reduce((s, a) => s + (Number(a.passages) || 0), 0);

  let h = `
    <table>
      <thead>
        <tr>
          <th style="text-align:left">Atelier</th>
          <th>Passages</th>
          <th>Note moy.</th>
          <th>Comport. moy.</th>
        </tr>
      </thead>
      <tbody>`;

  data.forEach(a => {
    const passages = Number(a.passages) || 0;
    const pct = Math.round((passages / maxPassages) * 100);
    const cls = pct >= 70 ? 'high' : pct >= 40 ? 'medium' : 'low';
    const id = 'a-' + String(a.numAtelier || '').replace(/[^a-zA-Z0-9_-]/g, '');

    h += `
      <tr class="atelier-row" id="row-${id}" onclick="toggleDetail('${id}', this)">
        <td>
          <div style="display:flex;align-items:center;">
            <span class="toggle-icon" id="icon-${id}">▶</span>
            <div>
              <div class="atelier-num">Atelier ${a.numAtelier || '—'}</div>
              <div class="atelier-nom">${a.nomAtelier || 'Sans nom'}</div>
            </div>
          </div>
        </td>
        <td>
          <div class="prog-wrap">
            <span class="passages-num">${passages}</span>
            <div class="prog-bar">
              <div class="prog-fill ${cls}" style="width:${pct}%"></div>
            </div>
          </div>
        </td>
        <td><span class="moy-chip">${a.moyenneNote || '—'} / 10</span></td>
        <td>
          <span class="moy-chip" style="background:var(--green-lt);color:var(--green)">
            ${a.moyenneComport || '—'} / 5
          </span>
        </td>
      </tr>`;

    const equipes = Array.isArray(a.equipes) ? [...a.equipes] : [];
    equipes.sort((x, y) => (Number(y.note) || 0) - (Number(x.note) || 0));

    h += `
      <tr class="detail-row" id="detail-${id}">
        <td colspan="4" style="padding:0;">
          <div class="detail-inner">
            <table>
              <thead>
                <tr>
                  <th style="text-align:left">N°</th>
                  <th style="text-align:left">Équipe</th>
                  <th style="text-align:left">Établissement</th>
                  <th style="text-align:center">Note</th>
                  <th style="text-align:center">Comportement</th>
                </tr>
              </thead>
              <tbody>`;

    equipes.forEach(e => {
      const note = Number(e.note) || 0;
      const np = Math.round((note / 10) * 100);
      const nc = note >= 7 ? 'high' : note >= 4 ? 'medium' : 'low';

      h += `
        <tr>
          <td><span style="font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--navy)">${e.num || '—'}</span></td>
          <td>${e.nom || '—'}</td>
          <td style="color:var(--text3);font-size:11px">${e.etab || '—'}</td>
          <td style="text-align:center">
            <div class="note-bar-wrap" style="justify-content:center">
              <span class="note-val">${note}</span>
              <div class="note-bar">
                <div class="note-bar-fill ${nc}" style="width:${np}%"></div>
              </div>
            </div>
          </td>
          <td style="text-align:center">
            <span style="font-family:'IBM Plex Mono',monospace;font-size:12px">${e.comport || '—'}</span>
          </td>
        </tr>`;
    });

    h += `
              </tbody>
            </table>
          </div>
        </td>
      </tr>`;
  });

  h += `
      </tbody>
    </table>
    <div style="padding:10px 14px;background:var(--bg);border-top:1px solid var(--border);font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text3);text-align:right">
      Total passages : <strong style="color:var(--navy)">${total}</strong>
    </div>`;

  document.getElementById('bodyAteliers').innerHTML = h;
}

function toggleDetail(id, row) {
  const d = document.getElementById('detail-' + id);
  const i = document.getElementById('icon-' + id);
  if (!d || !i) return;

  const ouvert = d.classList.contains('visible');
  d.classList.toggle('visible', !ouvert);
  i.textContent = ouvert ? '▶' : '▼';
  row.classList.toggle('open', !ouvert);
}

function exporterCSVGlobal() {
  if (!ateliersData.length) {
    toast('Aucune donnée', 'err');
    return;
  }

  const rows = [['Atelier', 'Nom atelier', 'N° équipe', 'Nom équipe', 'Établissement', 'Note atelier', 'Comportement']];

  ateliersData.forEach(a => {
    const equipes = Array.isArray(a.equipes) ? a.equipes : [];

    if (!equipes.length) {
      rows.push([a.numAtelier, a.nomAtelier, '', '', '', '', '']);
    } else {
      [...equipes]
        .sort((x, y) => (Number(x.num) || 0) - (Number(y.num) || 0))
        .forEach(e => {
          rows.push([a.numAtelier, a.nomAtelier, e.num || '', e.nom || '', e.etab || '', e.note || '', e.comport || '']);
        });
    }
  });

  telechargerCSV(rows, 'passages_rallye_2026_complet.csv');
}

function exporterCSVAtelier() {
  if (!ateliersData.length) {
    toast('Aucune donnée', 'err');
    return;
  }

  const nums = ateliersData.map(a => a.numAtelier).join(', ');
  const num = prompt(`Numéro atelier à exporter :

Disponibles : ${nums}`);

  if (!num) return;

  const a = ateliersData.find(x => String(x.numAtelier) === num.trim());

  if (!a) {
    toast('Atelier ' + num + ' non trouvé', 'err');
    return;
  }

  const rows = [
    ['Rallye Citoyen 2026 — Atelier ' + a.numAtelier + ' — ' + a.nomAtelier],
    [],
    ['Passages : ' + a.passages, 'Note moy. : ' + a.moyenneNote + '/10', 'Comportement moy. : ' + (a.moyenneComport || '—') + '/5'],
    [],
    ['N° équipe', 'Nom équipe', 'Établissement', 'Note atelier', 'Comportement']
  ];

  const equipes = Array.isArray(a.equipes) ? a.equipes : [];

  [...equipes]
    .sort((x, y) => (Number(x.num) || 0) - (Number(y.num) || 0))
    .forEach(e => {
      rows.push([e.num || '', e.nom || '', e.etab || '', e.note || '', e.comport || '']);
    });

  const safeName = String(a.nomAtelier || 'atelier')
    .replace(/[^a-zA-Z0-9]/g, '_')
    .slice(0, 30);

  telechargerCSV(rows, 'passages_atelier_' + a.numAtelier + '_' + safeName + '.csv');
}

function telechargerCSV(rows, filename) {
  const bom = '\uFEFF';

  const csv = bom + rows.map(r => r.map(v => {
    const s = v === undefined || v === null ? '' : String(v);
    return s.includes(',') || s.includes('"') || s.includes('\n')
      ? '"' + s.replace(/"/g, '""') + '"'
      : s;
  }).join(',')).join('\n');

  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  a.download = filename;
  a.click();

  toast('✅ Export téléchargé');
}

function exporterPDF() {
  ateliersData.forEach(a => {
    const id = 'a-' + String(a.numAtelier || '').replace(/[^a-zA-Z0-9_-]/g, '');
    const d = document.getElementById('detail-' + id);
    const i = document.getElementById('icon-' + id);
    const r = document.getElementById('row-' + id);

    if (d && !d.classList.contains('visible')) {
      d.classList.add('visible');
      if (i) i.textContent = '▼';
      if (r) r.classList.add('open');
    }
  });

  setTimeout(() => window.print(), 300);
}

async function apiGet(action) {
  if (typeof API_URL === 'undefined' || !API_URL) {
    throw new Error('API_URL non défini dans /PC/config.js');
  }

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);

  try {
    const res = await fetch(API_URL + '?action=' + encodeURIComponent(action), {
      signal: controller.signal
    });

    if (!res.ok) {
      throw new Error('HTTP ' + res.status);
    }

    return await res.json();

  } catch (e) {
    if (e.name === 'AbortError') {
      throw new Error('Délai dépassé : l’API ne répond pas');
    }
    throw e;

  } finally {
    clearTimeout(timeout);
  }
}

function toast(msg, type) {
  const t = document.getElementById('toast');
  if (!t) return;

  t.textContent = msg;
  t.className = 'toast ' + (type || '');
  t.classList.add('on');

  setTimeout(() => t.classList.remove('on'), 3000);
}
</script>
