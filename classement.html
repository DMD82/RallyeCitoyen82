<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classement — Rallye Citoyen 2026</title>
<script src="config.js"></script>
<script src="nav.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap');

  :root {
    --navy:    #1a2744;
    --navy-lt: #243358;
    --gold:    #b8932a;
    --gold-lt: #f5ead4;
    --gold-mid:#e8d090;
    --bg:      #f2f0eb;
    --bg2:     #e8e5de;
    --white:   #ffffff;
    --text:    #1a1e2e;
    --text2:   #4a5068;
    --text3:   #8a90a8;
    --border:  #dcd8ce;
    --border2: #c8c4b8;
    --green:   #1a5a32;
    --green-lt:#e8f5ed;
    --red:     #8b1a1a;
    --shadow:  rgba(26,39,68,0.08);
    --or:      #c8a84b;
    --argent:  #8a96a8;
    --bronze:  #8b5a2a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Source Sans 3', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

  
  
  
  
  
  
  
  

  /* ── NAV ── */
  .nav-wrap { background: var(--white); border-bottom: 1px solid var(--border); }
  nav { display: flex; align-items: center; padding: 0 20px; max-width: 900px; margin: 0 auto; }
  .tab { padding: 11px 16px; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s, border-color .15s; }
  .tab:hover { color: var(--text2); }
  .tab.active { color: var(--navy); border-bottom-color: var(--gold); }
  .nav-spacer { flex: 1; }
  .nav-info { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text3); display: flex; align-items: center; gap: 8px; padding: 8px 0; }
  .btn-refresh { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--text3); transition: all .15s; }
  .btn-refresh:hover { border-color: var(--navy); color: var(--navy); }

  /* ── MAIN ── */
  main { flex: 1; max-width: 900px; margin: 0 auto; padding: 20px 20px 60px; width: 100%; }
  .panel { display: none; }
  .panel.active { display: block; }

  /* ── BLOC CLASSEMENT ── */
  .bloc { margin-bottom: 24px; }
  .bloc-titre {
    font-family: 'Libre Baskerville', serif;
    font-weight: 700; font-size: 16px;
    color: var(--navy); margin-bottom: 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .bloc-titre::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* ── PRIX SPÉCIAL ── */
  .prix-special {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 24px;
    box-shadow: 0 2px 8px var(--shadow);
    border-left: 4px solid var(--gold);
  }
  .prix-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
  .prix-equipe { font-family: 'Libre Baskerville', serif; font-weight: 700; font-size: 18px; color: var(--navy); margin-bottom: 4px; }
  .prix-meta { font-size: 13px; color: var(--text2); display: flex; gap: 16px; flex-wrap: wrap; }
  .prix-score { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 20px; color: var(--gold); }
  .prix-rang { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text3); margin-top: 4px; }

  /* ── TABLEAU ── */
  .tbl-wrap { background: var(--white); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: 0 2px 8px var(--shadow); }
  table { width: 100%; border-collapse: collapse; }
  thead tr { background: var(--bg); }
  th { padding: 8px 12px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); text-align: center; border-bottom: 1px solid var(--border); font-weight: 600; }
  th:nth-child(2) { text-align: left; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 13px; text-align: center; }
  td:nth-child(2) { text-align: left; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg); }

  /* Rang médailles */
  .rang-cell { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 15px; min-width: 36px; }
  .rang-1 { color: var(--or); }
  .rang-2 { color: var(--argent); }
  .rang-3 { color: var(--bronze); }
  .rang-n { color: var(--text3); font-size: 13px; }

  /* Médailles emoji pour top 3 */
  .medaille { font-size: 18px; }

  .eq-num { font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--navy); font-size: 12px; }
  .eq-nom { font-size: 13px; font-weight: 600; color: var(--text); }
  .eq-etab { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .cd-badge { display: inline-block; font-size: 9px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 1px 5px; border-radius: 4px; background: rgba(26,39,68,0.1); color: var(--navy); margin-left: 4px; }

  .pond-chip { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; padding: 4px 10px; border-radius: 10px; font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 14px; background: var(--navy); color: var(--gold-mid); }
  .pond-chip.or { background: var(--or); color: white; }
  .pond-chip.argent { background: var(--argent); color: white; }
  .pond-chip.bronze { background: var(--bronze); color: white; }

  .comport-chip { display: inline-flex; align-items: center; justify-content: center; min-width: 40px; padding: 3px 8px; border-radius: 8px; font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 13px; background: var(--green-lt); color: var(--green); }
  .nb-chip { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text3); }

  .state-box { padding: 48px; text-align: center; }
  .state-desc { font-size: 13px; color: var(--text3); line-height: 1.5; margin-top: 8px; }
  .spin-dark { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border2); border-top-color: var(--navy); border-radius: 50%; animation: rot .6s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* ── CLASSEMENT COMPLET ── */
  .search-wrap { position: relative; margin-bottom: 14px; }
  .search-wrap input { width: 100%; padding: 9px 14px 9px 36px; background: var(--white); border: 1.5px solid var(--border2); border-radius: 10px; font-family: 'Source Sans 3', sans-serif; font-size: 14px; color: var(--text); transition: border-color .15s; }
  .search-wrap input:focus { outline: none; border-color: var(--navy); }
  .search-wrap::before { content: '🔍'; position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 13px; pointer-events: none; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(70px); background: var(--navy); color: white; padding: 11px 22px; border-radius: 30px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; z-index: 999; transition: transform .25s ease; letter-spacing: .04em; box-shadow: 0 8px 30px rgba(26,39,68,0.25); white-space: nowrap; }
  .toast.on { transform: translateX(-50%) translateY(0); }
  .toast.err { background: var(--red); }
</style>
</head>
<body>

<div class="nav-wrap">
  <nav>
    <div class="tab active" id="tab-podium" onclick="showTab('podium')">Podium</div>
    <div class="tab" id="tab-complet" onclick="showTabComplet()">Classement complet</div>
    <div class="nav-spacer"></div>
    <div class="nav-info">
      <span id="lastUpdate">—</span>
      <button class="btn-refresh" onclick="chargerDonnees()">↻ Actualiser</button>
    </div>
  </nav>
</div>

<main>

  <!-- ═══ PODIUM ═══ -->
  <div class="panel active" id="panel-podium">
    <div id="podiumContent">
      <div class="state-box">
        <div class="spin-dark" style="margin:0 auto 12px"></div>
        <div class="state-desc">Chargement du classement…</div>
      </div>
    </div>
  </div>

  <!-- ═══ CLASSEMENT COMPLET ═══ -->
  <div class="panel" id="panel-complet">
    <div class="search-wrap">
      <input type="text" id="searchComplet" placeholder="Rechercher une équipe…" oninput="filtrerComplet()">
    </div>
    <div class="tbl-wrap">
      <div id="complet-body">
        <div class="state-box"><div class="state-desc">Chargement…</div></div>
      </div>
    </div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
let classementData = null;

document.addEventListener('DOMContentLoaded', () => {
  chargerDonnees();
  setInterval(chargerDonnees, 30000);
});

async function chargerDonnees() {
  try {
    const data = await apiGet('getClassement');
    classementData = data;

    if (document.getElementById('panel-podium').classList.contains('active')) {
      renderPodium();
    }
    if (document.getElementById('panel-complet').classList.contains('active')) {
      filtrerComplet();
    }

    const now = new Date();
    document.getElementById('lastUpdate').textContent =
      'Actualisé à ' + now.getHours().toString().padStart(2,'0') + ':' +
      now.getMinutes().toString().padStart(2,'0') + ':' +
      now.getSeconds().toString().padStart(2,'0');

  } catch (e) {
    toast('Erreur : ' + e.message, 'err');
  }
}

// ── PODIUM ──────────────────────────────────────────────
function renderPodium() {
  const wrap = document.getElementById('podiumContent');
  if (!classementData) return;

  if (classementData.message) {
    wrap.innerHTML = `<div class="state-box"><div class="state-desc">⚠️ ${classementData.message}</div></div>`;
    return;
  }

  let h = '';

  // ── Top 10 général ──
  h += `<div class="bloc"><div class="bloc-titre">🏆 Top 10 — Classement général</div>`;
  h += renderTopTable(classementData.top10 || [], 'notePonderee', false);
  h += `</div>`;

  // ── Top 3 hors CD ──
  if (classementData.horsCD && classementData.horsCD.length) {
    h += `<div class="bloc"><div class="bloc-titre">🏅 Top 3 hors classe de défense</div>`;
    h += `<div class="tbl-wrap"><table><thead><tr>
      <th>Rang hors CD</th><th style="text-align:left">Équipe</th>
      <th>Note pondérée</th><th>Rang général</th><th>Nb ateliers</th>
    </tr></thead><tbody>`;

    const medalles = ['🥇','🥈','🥉'];
    const chipCls  = ['or','argent','bronze'];

    classementData.horsCD.forEach((e, i) => {
      h += `<tr>
        <td><span class="medaille">${medalles[i] || ''}</span></td>
        <td>
          <span class="eq-num">${e.num}</span>
          <div class="eq-nom">${e.nom}</div>
          <div class="eq-etab">${e.etab}</div>
        </td>
        <td><span class="pond-chip ${chipCls[i] || ''}">${e.notePonderee}</span></td>
        <td><span class="rang-cell rang-n">${e.rangGeneral}e</span></td>
        <td><span class="nb-chip">${e.nbAteliers}</span></td>
      </tr>`;
    });

    h += `</tbody></table></div></div>`;
  }

  // ── Top 3 établissements ──
  if (classementData.topEtab && classementData.topEtab.length) {
    h += `<div class="bloc"><div class="bloc-titre">🏫 Top 3 établissements</div>`;
    h += `<div class="tbl-wrap"><table><thead><tr>
      <th>Rang</th><th style="text-align:left">Équipe</th>
      <th>Note pondérée</th><th>Nb ateliers</th>
    </tr></thead><tbody>`;
    classementData.topEtab.forEach((e, i) => {
      const medalles = ['🥇','🥈','🥉'];
      h += `<tr>
        <td><span class="medaille">${medalles[i] || ''}</span></td>
        <td>
          <div class="eq-num">${e.num}</div>
          <div class="eq-nom">${e.nom}</div>
          <div class="eq-etab">${e.etab}</div>
        </td>
        <td><span class="pond-chip ${i===0?'or':i===1?'argent':'bronze'}">${e.notePonderee}</span></td>
        <td><span class="nb-chip">${e.nbAteliers}</span></td>
      </tr>`;
    });
    h += `</tbody></table></div></div>`;
  }

  // ── Top 10 comportement ──
  h += `<div class="bloc"><div class="bloc-titre">🤝 Top 10 — Comportement</div>`;
  h += renderTopTable(classementData.comportement || [], 'comportement', true);
  h += `</div>`;

  wrap.innerHTML = h;
}

function renderTopTable(data, scoreCol, isComport) {
  if (!data.length) return '<div class="state-box"><div class="state-desc">Aucune donnée disponible.</div></div>';

  let h = `<div class="tbl-wrap"><table><thead><tr>
    <th>Rang</th><th style="text-align:left">Équipe</th>
    <th>${isComport ? 'Comportement' : 'Note pondérée'}</th>
    <th>Nb ateliers</th>
  </tr></thead><tbody>`;

  const medalles = ['🥇','🥈','🥉'];

  data.forEach((e, i) => {
    const estCD = e.classeDefense &&
      e.classeDefense.toString().trim().toLowerCase() !== '' &&
      e.classeDefense.toString().trim().toLowerCase() !== 'non' &&
      e.classeDefense.toString().trim().toLowerCase() !== 'pas encore';

    const rangClass = e.rang === 1 ? 'rang-1' : e.rang === 2 ? 'rang-2' : e.rang === 3 ? 'rang-3' : 'rang-n';
    const chipClass = e.rang === 1 ? 'or' : e.rang === 2 ? 'argent' : e.rang === 3 ? 'bronze' : '';
    const scoreVal  = isComport ? e.comportement : e.notePonderee;

    h += `<tr>
      <td>
        ${e.rang <= 3 ? `<span class="medaille">${medalles[e.rang-1]}</span>` : `<span class="rang-cell ${rangClass}">${e.rang}</span>`}
      </td>
      <td>
        <div style="display:flex;align-items:center;gap:5px">
          <span class="eq-num">${e.num}</span>
          ${estCD ? `<span class="cd-badge">CD</span>` : ''}
        </div>
        <div class="eq-nom">${e.nom}</div>
        <div class="eq-etab">${e.etab}</div>
      </td>
      <td>
        ${isComport
          ? `<span class="comport-chip">${scoreVal}</span>`
          : `<span class="pond-chip ${chipClass}">${scoreVal}</span>`}
      </td>
      <td><span class="nb-chip">${e.nbAteliers}</span></td>
    </tr>`;
  });

  h += '</tbody></table></div>';
  return h;
}

// ── CLASSEMENT COMPLET ───────────────────────────────────
function showTabComplet() {
  showTab('complet');
  filtrerComplet();
}

function filtrerComplet() {
  if (!classementData || !classementData.complet) return;
  const search = document.getElementById('searchComplet').value.toLowerCase();
  const data   = classementData.complet.filter(e =>
    !search ||
    e.num.includes(search) ||
    e.nom.toLowerCase().includes(search) ||
    e.etab.toLowerCase().includes(search)
  );
  renderComplet(data);
}

function renderComplet(data) {
  const body = document.getElementById('complet-body');
  if (!data || !data.length) {
    body.innerHTML = '<div class="state-box"><div class="state-desc">Aucune donnée disponible.</div></div>';
    return;
  }

  let h = `<table><thead><tr>
    <th>Rang</th>
    <th style="text-align:left">Équipe</th>
    <th>Note pondérée</th>
    <th>Ateliers</th>
    <th>Fil Rouge</th>
    <th>Comport.</th>
    <th>Nb ateliers</th>
  </tr></thead><tbody>`;

  data.forEach(e => {
    const estCD = e.classeDefense &&
      e.classeDefense.toString().trim().toLowerCase() !== '' &&
      e.classeDefense.toString().trim().toLowerCase() !== 'non' &&
      e.classeDefense.toString().trim().toLowerCase() !== 'pas encore';

    const medalles = {1:'🥇', 2:'🥈', 3:'🥉'};
    const rangClass = e.rang <= 3 ? `rang-${e.rang}` : 'rang-n';

    h += `<tr>
      <td>
        ${medalles[e.rang]
          ? `<span class="medaille">${medalles[e.rang]}</span>`
          : `<span class="rang-cell ${rangClass}">${e.rang}</span>`}
      </td>
      <td>
        <div style="display:flex;align-items:center;gap:5px">
          <span class="eq-num">${e.num}</span>
          ${estCD ? `<span class="cd-badge">CD</span>` : ''}
        </div>
        <div class="eq-nom">${e.nom}</div>
        <div class="eq-etab">${e.etab}</div>
      </td>
      <td><span class="pond-chip ${e.rang===1?'or':e.rang===2?'argent':e.rang===3?'bronze':''}">${e.notePonderee}</span></td>
      <td><span class="score-cell" style="font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--navy)">${e.totalAtelier}</span></td>
      <td><span style="font-family:'IBM Plex Mono',monospace;font-weight:600;color:#6b2f8a">${e.filRouge}</span></td>
      <td><span class="comport-chip">${e.comportement}</span></td>
      <td><span class="nb-chip">${e.nbAteliers}</span></td>
    </tr>`;
  });

  h += '</tbody></table>';
  body.innerHTML = h;
}

// ── UTILITAIRES ──────────────────────────────────────────
function showTab(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

async function apiGet(action) {
  const res = await fetch(`${API_URL}?action=${action}`);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || '');
  t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 3000);
}
</script>
</body>
</html>
