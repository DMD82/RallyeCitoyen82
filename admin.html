<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration — Rallye Citoyen 2026</title>

<script src="config.js"></script>
<script src="nav.js"></script>

<style>
/* === (TON CSS INCHANGÉ — conservé tel quel) === */
/* (je ne le répète pas ici pour lisibilité, mais garde EXACTEMENT ton CSS actuel) */
</style>
</head>

<body>

<!-- ═══ ÉCRAN CONNEXION ═══ -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <img src="LogoRC2026.png" class="login-logo" alt="" onerror="this.style.display='none'">
    <div class="login-title">Administration</div>
    <div class="login-sub">Accès restreint · Rallye Citoyen 2026</div>

    <div style="position:relative;margin-bottom:12px;">
      <input type="password" class="login-input" id="loginMdp"
        placeholder="Mot de passe"
        onkeydown="if(event.key==='Enter')seConnecter()"
        style="padding-right:44px;">
      <button onclick="toggleVoirMdp()" type="button"
        style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text3);"
        id="btnVoirMdp">
        👁
      </button>
    </div>

    <button class="login-btn" onclick="seConnecter()">Accéder</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- ═══ PAGE ADMIN ═══ -->
<div class="admin-content" id="adminContent">

  <div style="background:var(--navy);padding:0">
    <div class="admin-header">
      <div class="admin-title">
        ⚙️ Administration
        <span class="admin-badge">Accès restreint</span>
      </div>
      <button class="btn-logout" onclick="seDeconnecter()">Déconnexion</button>
    </div>
  </div>

  <main>

    <!-- TRAITEMENT -->
    <div class="admin-section">
      <div class="admin-section-title">📊 Traitement des données</div>

      <div class="cards-grid">

        <div class="action-card">
          <div class="card-title">Importer les notes</div>
          <button class="btn primary" onclick="lancer('importAtelierData')">▶ Lancer</button>
        </div>

        <div class="action-card">
          <div class="card-title">Calculer les scores</div>
          <button class="btn primary" onclick="lancer('calculateSumsAndAverages')">▶ Lancer</button>
        </div>

        <div class="action-card">
          <div class="card-title">Générer classement</div>
          <button class="btn primary" onclick="lancer('generateClassement')">▶ Lancer</button>
        </div>

        <div class="action-card">
          <div class="card-title">Corriger Fil Rouge</div>
          <button class="btn primary" onclick="lancer('corrigerFilRouge')">▶ Lancer</button>
        </div>

      </div>
    </div>

    <!-- RESET -->
    <div class="admin-section">
      <div class="admin-section-title">🧹 Réinitialisation</div>

      <div class="cards-grid">

        <div class="action-card danger">
          <div class="card-title">Reset Fil Rouge</div>
          <button class="btn danger"
            onclick="confirmerAction('resetGlobal',{cible:'filrouge'},'Reset Fil Rouge ?')">
            ⚠ Reset
          </button>
        </div>

        <div class="action-card danger">
          <div class="card-title">Reset Bonus/Malus</div>
          <button class="btn danger"
            onclick="confirmerAction('resetGlobal',{cible:'bonusmalus'},'Reset Bonus ?')">
            ⚠ Reset
          </button>
        </div>

        <div class="action-card danger">
          <div class="card-title">Reset Note Atelier</div>
          <button class="btn danger"
            onclick="confirmerAction('resetNoteParAtelier',{},'Vider notes ?')">
            ⚠ Reset
          </button>
        </div>

        <div class="action-card danger">
          <div class="card-title">RESET TOTAL</div>
          <button class="btn danger"
            onclick="confirmerAction('resetGlobal',{cible:'all'},'Tout supprimer ?')">
            ☢️ FULL RESET
          </button>
        </div>

      </div>
    </div>

    <!-- LOG -->
    <div class="admin-section">
      <div class="admin-section-title">📋 Journal</div>
      <div class="log-wrap" id="logWrap"></div>
    </div>

  </main>
</div>

<div class="toast" id="toast"></div>

<script>

/* ───────────────────────────── */
/* CONFIG */
/* ───────────────────────────── */

if (typeof MDP_ADMIN === 'undefined') {
  var MDP_ADMIN = 'SemperParatiDMD82!';
}

let authenticated = false;


/* ───────────────────────────── */
/* AUTH */
/* ───────────────────────────── */

function seConnecter() {
  const mdp = document.getElementById('loginMdp').value;

  if (mdp === MDP_ADMIN) {
    authenticated = true;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminContent').classList.add('visible');
    log('Connexion OK');
  } else {
    log('Mot de passe incorrect', 'err');
  }
}

function seDeconnecter() {
  authenticated = false;
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('adminContent').classList.remove('visible');
}


/* ───────────────────────────── */
/* ACTIONS */
/* ───────────────────────────── */

async function lancer(action, params = {}) {

  if (!authenticated) return;

  log(`▶ ${action}`);

  try {

    const payload = {
      action,
      ...params,
      motDePasse: MDP_ADMIN
    };

    let endpoint = 'adminAction';

    if (action === 'resetGlobal') endpoint = 'resetGlobal';
    if (action === 'resetNoteParAtelier') endpoint = 'resetNoteParAtelier';

    const url = `${API_URL}?action=${endpoint}&data=${encodeURIComponent(JSON.stringify(payload))}`;

    const res = await fetch(url);

    if (!res.ok) throw new Error(res.status);

    const json = await res.json();

    if (json.success) {
      log(`✓ ${json.message || action}`);
      toast('OK', 'ok');
    } else {
      log(`✗ ${json.message}`, 'err');
      toast(json.message, 'err');
    }

  } catch (e) {
    log(`Erreur : ${e.message}`, 'err');
    toast(e.message, 'err');
  }
}


function confirmerAction(action, params, message) {
  if (!confirm(message)) return;
  lancer(action, params);
}


/* ───────────────────────────── */
/* UI */
/* ───────────────────────────── */

function log(msg, type='') {
  const wrap = document.getElementById('logWrap');
  const d = document.createElement('div');
  d.className = 'log-entry ' + type;
  d.textContent = msg;
  wrap.appendChild(d);
}

function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' on';
  setTimeout(()=>t.classList.remove('on'),3000);
}

function toggleVoirMdp() {
  const input = document.getElementById('loginMdp');
  input.type = input.type === 'password' ? 'text' : 'password';
}


/* ───────────────────────────── */

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('loginMdp').focus();
});

</script>

</body>
</html>
