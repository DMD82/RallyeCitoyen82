<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fil Rouge — Rallye Citoyen 82</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root {
    --bg:      #0e0f11;
    --bg2:     #161820;
    --bg3:     #1e2028;
    --border:  #2e3040;
    --border2: #3d4055;
    --text:    #d8dae8;
    --text2:   #8890a8;
    --text3:   #555d75;
    --accent:  #c8a84b;
    --red:     #c0392b;
    --green:   #1d7a4a;
    --white:   #f0f2f8;
    --f1: #1a3a6b; --f2: #6b1a1a; --f3: #1a5a32; --f4: #5a3e10; --f5: #3a1a5a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }

  .app-label { padding: 10px 16px 0; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--text3); }

  nav { display: flex; border-bottom: 1px solid var(--border); padding: 0 16px; margin-top: 4px; }
  .tab { padding: 10px 14px; font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; display: flex; align-items: center; gap: 7px; }
  .tab:hover { color: var(--text2); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab .n { background: var(--bg3); border: 1px solid var(--border); color: var(--text2); font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 1px 6px; border-radius: 3px; }
  .tab.active .n { background: var(--accent); color: var(--bg); border-color: var(--accent); }

  main { max-width: 780px; margin: 0 auto; padding: 16px 16px 60px; }
  .panel { display: none; }
  .panel.active { display: block; }

  .section { border: 1px solid var(--border); border-radius: 4px; margin-bottom: 12px; background: var(--bg2); overflow: hidden; }
  .section-head { padding: 9px 14px; font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--text2); border-bottom: 1px solid var(--border); background: var(--bg3); display: flex; align-items: center; justify-content: space-between; }
  .section-body { padding: 14px; }

  .select-wrap { position: relative; }
  .select-wrap select { width: 100%; padding: 10px 36px 10px 12px; background: var(--bg3); border: 1px solid var(--border2); border-radius: 3px; color: var(--white); font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 500; appearance: none; cursor: pointer; transition: border-color .15s; }
  .select-wrap select:focus { outline: none; border-color: var(--accent); }
  .select-wrap::after { content: '▾'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 13px; pointer-events: none; }
  .equipe-meta { margin-top: 7px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text3); min-height: 16px; letter-spacing: .03em; }
  .equipe-meta.warn { color: var(--accent); }

  .feuillet { border: 1px solid var(--border); border-radius: 4px; margin-bottom: 10px; overflow: hidden; }
  .feuillet-head { padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .feuillet-head.f1 { background: var(--f1); } .feuillet-head.f2 { background: var(--f2); }
  .feuillet-head.f3 { background: var(--f3); } .feuillet-head.f4 { background: var(--f4); }
  .feuillet-head.f5 { background: var(--f5); }
  .feuillet-label { font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,0.9); }
  .feuillet-score { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.55); background: rgba(0,0,0,0.25); padding: 2px 9px; border-radius: 2px; letter-spacing: .04em; }
  .feuillet-body { background: var(--bg2); padding: 12px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 520px) { .feuillet-body { grid-template-columns: 1fr; } }

  .q-row { display: flex; align-items: flex-start; gap: 8px; }
  .q-id { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text3); min-width: 24px; padding-top: 1px; letter-spacing: .02em; }
  .q-body { flex: 1; }
  .q-text { font-size: 12px; color: var(--text2); margin-bottom: 6px; line-height: 1.3; }
  .q-btns { display: flex; gap: 4px; }
  .cbtn { width: 28px; height: 28px; background: var(--bg3); border: 1px solid var(--border2); border-radius: 2px; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px; color: var(--text3); cursor: pointer; transition: all .12s; display: flex; align-items: center; justify-content: center; }
  .cbtn:hover { border-color: var(--text2); color: var(--text); }
  .cbtn.on { background: var(--accent); border-color: var(--accent); color: var(--bg); }

  .score-bar { border: 1px solid var(--border); border-radius: 4px; background: var(--bg2); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .score-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); }
  .score-val { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 24px; color: var(--accent); letter-spacing: .04em; }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { padding: 9px 16px; border: 1px solid var(--border2); border-radius: 3px; background: var(--bg3); color: var(--text); font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; cursor: pointer; transition: all .15s; display: flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: var(--text2); color: var(--white); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 700; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.danger { border-color: var(--red); color: var(--red); }
  .btn.danger:hover { background: var(--red); color: var(--white); }
  .btn:disabled { opacity: .4; cursor: not-allowed; filter: none; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
  .overlay.on { display: flex; }
  .modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: 4px; padding: 24px; max-width: 380px; width: 100%; }
  .modal-title { font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  .modal-body { font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom: 20px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(60px); background: var(--bg3); border: 1px solid var(--border2); color: var(--text); padding: 10px 20px; border-radius: 3px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; z-index: 999; transition: transform .25s ease; letter-spacing: .04em; white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  .toast.on { transform: translateX(-50%) translateY(0); }
  .toast.ok  { border-color: var(--green); color: #5ecf8a; }
  .toast.err { border-color: var(--red); color: #e07070; }
  .toast.wrn { border-color: var(--accent); color: var(--accent); }

  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.2); border-top-color: var(--accent); border-radius: 50%; animation: rot .6s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }

  .tbl-wrap { border: 1px solid var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
  .tbl-head { background: var(--bg3); border-bottom: 1px solid var(--border); padding: 9px 14px; display: flex; align-items: center; justify-content: space-between; font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--text2); }
  .tbl-cnt { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text3); background: var(--bg); border: 1px solid var(--border); padding: 1px 7px; border-radius: 2px; }
  table { width: 100%; border-collapse: collapse; }
  thead tr { background: var(--bg3); }
  th { padding: 7px 10px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); text-align: center; border-bottom: 1px solid var(--border); }
  th:first-child { text-align: left; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 13px; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .eq-num { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px; color: var(--accent); }
  .eq-nom { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .chip { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 2px; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 12px; }
  .chip.f1 { background: rgba(26,58,107,0.4); color: #7aaae8; }
  .chip.f2 { background: rgba(107,26,26,0.4); color: #e87a7a; }
  .chip.f3 { background: rgba(26,90,50,0.4); color: #7ae8a0; }
  .chip.f4 { background: rgba(90,62,16,0.4); color: #e8c07a; }
  .chip.f5 { background: rgba(58,26,90,0.4); color: #c07ae8; }
  .chip.tot { background: var(--accent); color: var(--bg); width: auto; padding: 0 8px; }
  .btn-det { background: none; border: 1px solid var(--border); border-radius: 2px; padding: 3px 9px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text3); cursor: pointer; letter-spacing: .04em; transition: all .12s; }
  .btn-det:hover { border-color: var(--text2); color: var(--text); }
  .empty { padding: 32px; text-align: center; color: var(--text3); font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .06em; }

  .detail-wrap { border: 1px solid var(--border); border-radius: 4px; overflow: hidden; margin-top: 10px; background: var(--bg2); }
  .detail-hd { background: var(--bg3); border-bottom: 1px solid var(--border); padding: 9px 14px; display: flex; align-items: center; justify-content: space-between; font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--text2); }
  .detail-close { background: none; border: none; color: var(--text3); font-size: 16px; cursor: pointer; line-height: 1; }
  .detail-close:hover { color: var(--text); }
  .detail-feuillet { padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .detail-feuillet:last-child { border-bottom: none; }
  .detail-f-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; }
  .detail-qs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
  @media (max-width: 480px) { .detail-qs { grid-template-columns: repeat(3, 1fr); } }
  .dq { border-radius: 3px; padding: 5px 3px; text-align: center; border: 1px solid transparent; }
  .dq .dn { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--text3); margin-bottom: 2px; letter-spacing: .04em; }
  .dq .dr { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 16px; }
  .dq .dc { font-family: 'IBM Plex Mono', monospace; font-size: 9px; margin-top: 1px; }
  .dq.ok  { background: rgba(29,122,74,0.15); border-color: rgba(29,122,74,0.3); }
  .dq.ok .dr { color: #5ecf8a; }
  .dq.ko  { background: rgba(192,57,43,0.15); border-color: rgba(192,57,43,0.3); }
  .dq.ko .dr { color: #e07070; }
  .dq.ko .dc { color: #5ecf8a; }
  .dq.na  { background: var(--bg3); border-color: var(--border); }
  .dq.na .dr { color: var(--text3); }

  .loading-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 300; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .loading-overlay.hidden { display: none; }
  .loading-txt { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .1em; color: var(--text3); }
</style>
</head>
<body>

<!-- Écran de chargement initial -->
<div class="loading-overlay" id="loadingOverlay">
  <span class="spin" style="width:20px;height:20px;border-width:3px"></span>
  <div class="loading-txt">Chargement des équipes…</div>
</div>

<div class="app-label">Fil Rouge</div>

<nav>
  <div class="tab active" id="tab-saisie" onclick="showTab('saisie')">Saisie</div>
  <div class="tab" id="tab-reponses" onclick="showTabReponses()">
    Réponses <span class="n" id="badgeN">0</span>
  </div>
</nav>

<main>

  <!-- ═══ SAISIE ═══ -->
  <div class="panel active" id="panel-saisie">

    <div class="section">
      <div class="section-head">Équipe</div>
      <div class="section-body">
        <div class="select-wrap">
          <select id="selEquipe" onchange="onEquipeChange()">
            <option value="">— Sélectionner une équipe —</option>
          </select>
        </div>
        <div class="equipe-meta" id="equipeMeta"></div>
      </div>
    </div>

    <div id="feuillets"></div>

    <div class="score-bar">
      <div class="score-label">Réponses saisies / Score</div>
      <div class="score-val" id="scoreVal">00 / 30</div>
    </div>

    <div class="actions">
      <button class="btn primary" id="btnSave" onclick="enregistrer()">↳ Enregistrer</button>
      <button class="btn" onclick="nouvelleEquipe()">↺ Nouvelle équipe</button>
      <button class="btn danger" onclick="toutEffacer()">✕ Effacer</button>
    </div>

  </div>

  <!-- ═══ RÉPONSES ═══ -->
  <div class="panel" id="panel-reponses">
    <div class="tbl-wrap">
      <div class="tbl-head">
        Équipes saisies
        <span class="tbl-cnt" id="tblCnt">0</span>
      </div>
      <div id="tblBody"><div class="empty">// AUCUNE SAISIE</div></div>
    </div>
    <div id="detailZone"></div>
  </div>

</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-title">⚠ Équipe déjà saisie</div>
    <div class="modal-body" id="modalTxt"></div>
    <div class="modal-actions">
      <button class="btn danger" onclick="confirmer()">Écraser</button>
      <button class="btn" onclick="annuler()">Annuler</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════
// ⚠️ METTRE À JOUR AVEC L'URL DE VOTRE DÉPLOIEMENT APPS SCRIPT
// ═══════════════════════════════════════════════════════
const API_URL = 'https://script.google.com/macros/s/AKfycbx_z4XjX0RobfuYxDcOE4TR3FJbzn0V6QSvaupYTxQ3QUPAdSVz9J9OIS0Rx4b8p86v/exec';

// ═══════════════════════════════════════════════════════
// RÉPONSES OFFICIELLES (côté client pour score temps réel)
// ═══════════════════════════════════════════════════════
const REP_OFF = [
  "B","B","C","C","B","C",  // F1 — SOIGNER
  "C","B","C","B","C","C",  // F2 — SECOURIR
  "B","C","B","B","C","C",  // F3 — SERVIR
  "B","B","B","C","C","B",  // F4 — COURAGE & HÉRITAGE
  "C","A","B","C","C","B"   // F5 — MISSION FINALE
];

const FEUILLETS = [
  { id:1, label:"I — SOIGNER",            cls:"f1", qs:["Geneviève de Galard à Diên Biên Phu","Valérie André — double spécialité","Caducée — domaine d'utilisation","Fondateur de la Croix-Rouge","Position PLS","Lettre S en alphabet OTAN"] },
  { id:2, label:"II — SECOURIR",           cls:"f2", qs:["Bataille commémorée en 2026 (110 ans)","Numéro d'urgence européen","Mission NE faisant PAS partie du SDIS","Réaction face à un email de phishing","Qui peut utiliser un DAE ?","Sanction douanière — liquide non déclaré"] },
  { id:3, label:"III — SERVIR",            cls:"f3", qs:["Légion d'Honneur — qui peut la recevoir ?","JDC — affirmation vraie","Bleuet de France — occasions","Rôle d'un porte-drapeau","Citoyens engagés volontairement dans les armées","Verdun 1916 — nombre de victimes"] },
  { id:4, label:"IV — COURAGE & HÉRITAGE", cls:"f4", qs:["Code Morse — décodage","André Maginot — grade en 1914","Marie Curie — contribution 14-18","Eau potable utilisable sur Terre","Médaille Militaire — à qui ?","SMV — public cible"] },
  { id:5, label:"V — MISSION FINALE",      cls:"f5", qs:["SIERRA-OSCAR-INDIA-GOLF-NOVEMBER-ECHO-ROMEO","SNU — public concerné","Urgence médicale grave — quel numéro ?","EPIDE — objectif principal","1re femme générale de l'armée française","Synthèse — esprit du triptyque citoyen"] }
];

// ═══════════════════════════════════════════════════════
// ÉTAT
// ═══════════════════════════════════════════════════════
const reps       = {};
let equipesData  = [];
let saisiesData  = {};
let pendingNum   = null;

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  buildFeuillets();
  chargerDonnees();
});

function buildFeuillets() {
  const wrap = document.getElementById('feuillets');
  FEUILLETS.forEach(f => {
    const d = document.createElement('div');
    d.className = 'feuillet';
    d.innerHTML = `
      <div class="feuillet-head ${f.cls}">
        <span class="feuillet-label">Feuillet ${f.label}</span>
        <span class="feuillet-score" id="cnt${f.id}">0 / 6</span>
      </div>
      <div class="feuillet-body" id="grid${f.id}"></div>`;
    wrap.appendChild(d);

    const grid = d.querySelector(`#grid${f.id}`);
    f.qs.forEach((txt, i) => {
      const q = (f.id - 1) * 6 + i + 1;
      const r = document.createElement('div');
      r.className = 'q-row';
      r.innerHTML = `
        <div class="q-id">Q${String(q).padStart(2,'0')}</div>
        <div class="q-body">
          <div class="q-text">${txt}</div>
          <div class="q-btns">
            ${['A','B','C'].map(l => `
              <button class="cbtn" data-q="${q}" data-v="${l}"
                onclick="pick(${q},'${l}',this)">${l}</button>`).join('')}
          </div>
        </div>`;
      grid.appendChild(r);
    });
  });
}

// ═══════════════════════════════════════════════════════
// APPELS API
// ═══════════════════════════════════════════════════════
async function apiGet(action) {
  const res = await fetch(`${API_URL}?action=${action}`);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function apiPost(payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

// ═══════════════════════════════════════════════════════
// CHARGEMENT DES DONNÉES
// ═══════════════════════════════════════════════════════
async function chargerDonnees() {
  try {
    const data = await apiGet('init');
    equipesData = data.equipes || [];
    saisiesData = {};
    (data.saisies || []).forEach(s => saisiesData[s.num] = s);

    const sel = document.getElementById('selEquipe');
    sel.innerHTML = '<option value="">— Sélectionner une équipe —</option>';
    equipesData.forEach(e => {
      const o = document.createElement('option');
      o.value = e.num;
      o.textContent = `${e.num} — ${e.nom}  ·  ${e.etab}`;
      sel.appendChild(o);
    });

    majBadge();
    document.getElementById('loadingOverlay').classList.add('hidden');
  } catch (e) {
    document.getElementById('loadingOverlay').classList.add('hidden');
    toast('Erreur chargement : ' + e.message, 'err');
  }
}

// ═══════════════════════════════════════════════════════
// SÉLECTION ÉQUIPE
// ═══════════════════════════════════════════════════════
function onEquipeChange() {
  const num  = document.getElementById('selEquipe').value;
  const meta = document.getElementById('equipeMeta');
  if (!num) { meta.textContent = ''; meta.className = 'equipe-meta'; return; }

  const eq = equipesData.find(e => e.num === num);
  if (saisiesData[num]) {
    meta.textContent = '⚠ Déjà saisie — sera écrasée si vous enregistrez';
    meta.className = 'equipe-meta warn';
    chargerReponsesExistantes(saisiesData[num]);
  } else {
    meta.textContent = eq ? eq.etab : '';
    meta.className = 'equipe-meta';
    resetReps(true);
  }
}

function chargerReponsesExistantes(s) {
  resetReps(true);
  (s.reponses || []).forEach((r, i) => {
    if (!r) return;
    const q = i + 1;
    reps[q] = r;
    const b = document.querySelector(`.cbtn[data-q="${q}"][data-v="${r}"]`);
    if (b) b.classList.add('on');
  });
  updateAll();
}

// ═══════════════════════════════════════════════════════
// SAISIE
// ═══════════════════════════════════════════════════════
function pick(q, val, btn) {
  document.querySelectorAll(`.cbtn[data-q="${q}"]`).forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  reps[q] = val;
  updateAll();
}

function updateAll() {
  FEUILLETS.forEach(f => {
    let n = 0;
    for (let i = 1; i <= 6; i++) { if (reps[(f.id-1)*6+i]) n++; }
    document.getElementById('cnt' + f.id).textContent = n + ' / 6';
  });
  let correct = 0, saisis = 0;
  for (let q = 1; q <= 30; q++) {
    if (reps[q]) {
      saisis++;
      if (reps[q] === REP_OFF[q-1]) correct++;
    }
  }
  document.getElementById('scoreVal').textContent =
    String(saisis).padStart(2,'0') + ' saisis · ' + String(correct).padStart(2,'0') + ' / 30';
}

// ═══════════════════════════════════════════════════════
// ENREGISTREMENT
// ═══════════════════════════════════════════════════════
function enregistrer() {
  const num = document.getElementById('selEquipe').value;
  if (!num) { toast('Sélectionner une équipe', 'wrn'); return; }

  if (saisiesData[num]) {
    const eq = equipesData.find(e => e.num === num);
    document.getElementById('modalTxt').innerHTML =
      `L'équipe <strong>${num} — ${eq ? eq.nom : ''}</strong> a déjà été saisie.<br>Confirmer l'écrasement ?`;
    pendingNum = num;
    document.getElementById('overlay').classList.add('on');
    return;
  }
  soumettre(num);
}

function confirmer() {
  document.getElementById('overlay').classList.remove('on');
  if (pendingNum) soumettre(pendingNum);
  pendingNum = null;
}
function annuler() {
  document.getElementById('overlay').classList.remove('on');
  pendingNum = null;
}

async function soumettre(num) {
  const arr = [];
  for (let q = 1; q <= 30; q++) arr.push(reps[q] || '');

  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> Envoi…';

  try {
    const res = await apiPost({ action: 'save', numEquipe: num, reponses: arr });
    btn.disabled = false;
    btn.innerHTML = '↳ Enregistrer';
    if (res.success) {
      toast('Équipe ' + num + ' enregistrée', 'ok');
      saisiesData[num] = { num, reponses: arr, ...res.scores };
      majBadge();
      setTimeout(nouvelleEquipe, 1200);
    } else {
      toast('Erreur : ' + res.message, 'err');
    }
  } catch (e) {
    btn.disabled = false;
    btn.innerHTML = '↳ Enregistrer';
    toast('Erreur réseau : ' + e.message, 'err');
  }
}

// ═══════════════════════════════════════════════════════
// ONGLET RÉPONSES
// ═══════════════════════════════════════════════════════
function showTabReponses() {
  showTab('reponses');
  renderReponses();
}

function renderReponses() {
  const saisies = Object.values(saisiesData).sort((a,b) => parseInt(a.num) - parseInt(b.num));
  document.getElementById('tblCnt').textContent = saisies.length;

  if (!saisies.length) {
    document.getElementById('tblBody').innerHTML = '<div class="empty">// AUCUNE SAISIE</div>';
    return;
  }

  let h = `<table><thead><tr>
    <th style="text-align:left">Équipe</th>
    <th>F1</th><th>F2</th><th>F3</th><th>F4</th><th>F5</th>
    <th>Total</th><th></th>
  </tr></thead><tbody>`;

  saisies.forEach(s => {
    const eq  = equipesData.find(e => e.num === s.num);
    const sc  = calcScores(s.reponses || []);
    const tot = sc.reduce((a,b) => a+b, 0);
    h += `<tr>
      <td><div class="eq-num">${s.num}</div><div class="eq-nom">${eq ? eq.nom : '—'}</div></td>
      ${sc.map((v,i) => `<td style="text-align:center"><span class="chip f${i+1}">${v}</span></td>`).join('')}
      <td style="text-align:center"><span class="chip tot">${tot}</span></td>
      <td><button class="btn-det" onclick="detail('${s.num}')">voir</button></td>
    </tr>`;
  });

  h += '</tbody></table>';
  document.getElementById('tblBody').innerHTML = h;
}

function detail(num) {
  const s  = saisiesData[num];
  const eq = equipesData.find(e => e.num === num);
  const rr = s.reponses || [];

  let h = `<div class="detail-wrap">
    <div class="detail-hd">
      <span>Détail — ${num}${eq ? ' · ' + eq.nom : ''}</span>
      <button class="detail-close" onclick="document.getElementById('detailZone').innerHTML=''">✕</button>
    </div>`;

  FEUILLETS.forEach(f => {
    h += `<div class="detail-feuillet">
      <div class="detail-f-label">Feuillet ${f.label}</div>
      <div class="detail-qs">`;
    for (let i = 1; i <= 6; i++) {
      const q   = (f.id-1)*6+i;
      const rep = rr[q-1] || '';
      const off = REP_OFF[q-1];
      const cls = !rep ? 'na' : rep === off ? 'ok' : 'ko';
      h += `<div class="dq ${cls}">
        <div class="dn">Q${String(q).padStart(2,'0')}</div>
        <div class="dr">${rep || '—'}</div>
        ${cls === 'ko' ? `<div class="dc">${off}</div>` : ''}
      </div>`;
    }
    h += `</div></div>`;
  });

  h += '</div>';
  const z = document.getElementById('detailZone');
  z.innerHTML = h;
  z.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ═══════════════════════════════════════════════════════
// UTILITAIRES
// ═══════════════════════════════════════════════════════
function calcScores(rr) {
  const s = [0,0,0,0,0];
  rr.forEach((r,i) => { if (r && r === REP_OFF[i]) s[Math.floor(i/6)]++; });
  return s;
}

function resetReps(clearBtns) {
  for (let q = 1; q <= 30; q++) delete reps[q];
  if (clearBtns) document.querySelectorAll('.cbtn.on').forEach(b => b.classList.remove('on'));
  updateAll();
}

function nouvelleEquipe() {
  document.getElementById('selEquipe').value = '';
  document.getElementById('equipeMeta').textContent = '';
  document.getElementById('equipeMeta').className = 'equipe-meta';
  resetReps(true);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toutEffacer() {
  if (confirm('Effacer la saisie en cours ?')) nouvelleEquipe();
}

function majBadge() {
  const n = Object.keys(saisiesData).length;
  document.getElementById('badgeN').textContent = n;
}

function showTab(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || '');
  t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 3000);
}
</script>
</body>
</html>
