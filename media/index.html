<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veille médiatique — Rallye Citoyen 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap');
:root{
  --navy:#1a2744;--navy-lt:#243358;--gold:#b8932a;--gold-lt:#f5ead4;--gold-mid:#e8d090;
  --bg:#f2f0eb;--bg2:#e8e5de;--white:#fff;--text:#1a1e2e;--text2:#4a5068;--text3:#8a90a8;
  --border:#dcd8ce;--border2:#c8c4b8;--shadow:rgba(26,39,68,0.08);
  --fb:#1877f2;--fb-lt:#e7f0fd;--li:#0a66c2;--li-lt:#e8f1fb;
  --tw:#111;--tw-lt:#f0f0f0;--ig:#e1306c;--ig-lt:#fce4ec;
  --pr:#c0392b;--pr-lt:#fdecea;--ra:#e67e22;--ra-lt:#fef5ec;
  --st:#9b59b6;--st-lt:#f5eeff;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
header{background:var(--navy);padding:28px 24px 24px;text-align:center;position:relative;overflow:hidden;}
header::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.015) 0,rgba(255,255,255,.015) 1px,transparent 1px,transparent 12px);pointer-events:none;}
.header-logo{width:80px;height:80px;object-fit:contain;margin-bottom:14px;filter:drop-shadow(0 4px 16px rgba(0,0,0,.3));}
.header-org{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:8px;}
.header-title{font-family:'Libre Baskerville',serif;font-weight:700;font-size:24px;color:#fff;margin-bottom:10px;}
.header-meta{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;}
.meta-pill{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.06em;padding:4px 14px;border-radius:20px;text-transform:uppercase;}
.meta-pill.date{background:var(--gold);color:var(--navy);}
.meta-pill.lieu{background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.15);}
main{flex:1;max-width:1100px;margin:0 auto;padding:28px 20px 60px;width:100%;}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--border2);border-top-color:var(--navy);border-radius:50%;animation:rot .6s linear infinite;}
@keyframes rot{to{transform:rotate(360deg)}}
.loading-state{text-align:center;padding:60px;display:flex;flex-direction:column;align-items:center;gap:12px;}
.loading-txt{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);}

/* ADD FORM */
.add-form{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:18px 22px;margin-bottom:22px;box-shadow:0 2px 8px var(--shadow);}
.add-form-title{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--text3);margin-bottom:12px;}
.add-form-row{display:flex;gap:8px;flex-wrap:wrap;}
.add-input{flex:1;min-width:200px;padding:9px 14px;background:var(--bg);border:1.5px solid var(--border2);border-radius:10px;font-family:'Source Sans 3',sans-serif;font-size:14px;color:var(--text);transition:border-color .15s;}
.add-input:focus{outline:none;border-color:var(--navy);}
.add-input.url{flex:2;}
.add-btn{padding:9px 18px;background:var(--navy);border:none;border-radius:10px;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.04em;cursor:pointer;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:7px;}
.add-btn:hover{background:var(--navy-lt);}
.add-btn:disabled{opacity:.5;cursor:not-allowed;}
.add-msg{font-family:'IBM Plex Mono',monospace;font-size:11px;margin-top:8px;padding:6px 12px;border-radius:8px;display:none;}
.add-msg.ok{display:block;background:var(--green-lt,#e8f5ed);color:#1a5a32;}
.add-msg.err{display:block;background:#fdecea;color:var(--pr);}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:22px;}
.stat{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:12px 14px;text-align:center;box-shadow:0 2px 8px var(--shadow);}
.stat-val{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:24px;line-height:1;}
.stat-lbl{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-top:4px;}

/* VIZ */
.viz{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:18px 22px;margin-bottom:22px;box-shadow:0 2px 8px var(--shadow);}
.viz-title{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--text3);margin-bottom:14px;}
.viz-row{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.viz-label{font-size:12px;font-weight:600;color:var(--text2);width:120px;flex-shrink:0;text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:7px;}
.viz-bar-wrap{flex:1;height:20px;background:var(--bg2);border-radius:5px;overflow:hidden;}
.viz-bar{height:100%;border-radius:5px;transition:width .7s ease;}
.viz-count{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--text2);width:20px;}

/* SECTIONS */
.section{margin-bottom:32px;}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--border);}
.section-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.section-title{font-family:'Libre Baskerville',serif;font-weight:700;font-size:16px;color:var(--navy);}
.section-count{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:2px 9px;border-radius:8px;background:var(--bg2);border:1px solid var(--border);color:var(--text3);}
.section.facebook .section-icon{background:var(--fb-lt);color:var(--fb);}
.section.story     .section-icon{background:var(--st-lt);color:var(--st);}
.section.instagram .section-icon{background:var(--ig-lt);color:var(--ig);}
.section.linkedin  .section-icon{background:var(--li-lt);color:var(--li);}
.section.twitter   .section-icon{background:var(--tw-lt);color:var(--tw);}
.section.presse    .section-icon{background:var(--pr-lt);color:var(--pr);}
.section.radio     .section-icon{background:var(--ra-lt);color:var(--ra);}

/* GRILLE */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.card{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px var(--shadow);transition:all .2s;display:flex;flex-direction:column;}
.card:hover{box-shadow:0 8px 24px var(--shadow);transform:translateY(-2px);}
.card-preview{height:130px;background:var(--bg2);overflow:hidden;}
.card-preview img{width:100%;height:100%;object-fit:cover;}
.card-head{padding:10px 12px 8px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--border);}
.card-icon{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.card-source-wrap{flex:1;min-width:0;}
.card-source{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-subtype{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;}
.card.facebook .card-icon{background:var(--fb-lt);color:var(--fb);}
.card.story    .card-icon{background:var(--st-lt);color:var(--st);}
.card.instagram .card-icon{background:var(--ig-lt);color:var(--ig);}
.card.linkedin  .card-icon{background:var(--li-lt);color:var(--li);}
.card.twitter   .card-icon{background:var(--tw-lt);color:var(--tw);}
.card.presse    .card-icon{background:var(--pr-lt);color:var(--pr);}
.card.radio     .card-icon{background:var(--ra-lt);color:var(--ra);}
.card-body{padding:10px 12px 12px;flex:1;display:flex;flex-direction:column;gap:7px;}
.card-title{font-family:'Libre Baskerville',serif;font-size:12px;font-weight:700;color:var(--navy);line-height:1.4;flex:1;}
.card-desc{font-size:11px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px;}
.card-date{font-size:10px;color:var(--text3);font-family:'IBM Plex Mono',monospace;}
.card-link{display:inline-flex;align-items:center;gap:4px;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;color:var(--navy);text-decoration:none;padding:4px 9px;border:1.5px solid var(--border2);border-radius:7px;transition:all .15s;}
.card-link:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
.error-box{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:32px;text-align:center;}
@media print{header .meta-pill.lieu,.add-form{display:none!important;}.card{break-inside:avoid;}body{background:white;}}
</style>
</head>
<body>

<header>
  <img src="../LogoRC2026.png" class="header-logo" alt="" onerror="this.style.display='none'">
  <div class="header-org">Délégation Militaire Départementale 82</div>
  <div class="header-title">Veille médiatique — Rallye Citoyen 2026</div>
  <div class="header-meta">
    <span class="meta-pill date">12 mai 2026</span>
    <span class="meta-pill lieu">Complexe Jacques Chirac · Montauban</span>
  </div>
</header>

<main id="main">
  <div class="loading-state"><div class="spin"></div><div class="loading-txt">Chargement de la veille…</div></div>
</main>

<script>
var MEDIA_API_URL = 'https://script.google.com/macros/s/AKfycby7cDltGGqTK0_ituhSSQEyXm_Uwd-CyiO01RIJlL24Q5sKo7tZQIv5XmaW0EGer83e/exec';

var TYPE_LABELS = {presse:'Presse',radio:'Radio',facebook:'Facebook',story:'Stories Facebook',instagram:'Instagram',twitter:'X / Twitter',linkedin:'LinkedIn',web:'Web'};
var TYPE_COLORS = {presse:'var(--pr)',radio:'var(--ra)',facebook:'var(--fb)',story:'var(--st)',instagram:'var(--ig)',twitter:'#222',linkedin:'var(--li)',web:'var(--text3)'};

var SECTION_ORDER = ['presse','radio','facebook','story','instagram','twitter','linkedin','web'];

var SVG = {
  presse:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8M15 18h-5M10 6h8v4h-8z"/></svg>',
  radio:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.4"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.4"/><path d="M19.1 4.9C23 8.8 23 15.2 19.1 19.1"/></svg>',
  facebook:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>',
  story:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/></svg>',
  instagram: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>',
  twitter:   '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>',
  linkedin:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>',
  web:       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
  add:       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  ext:       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>'
};

var SUBTYPE_LABELS = {post:'Post',reel:'Reel',story:'Story',tweet:'Tweet',video:'Vidéo'};

var allLinks = [];
var previewCache = {};

function ic(type, size) {
  size = size || 14;
  return (SVG[type]||SVG.web).replace('<svg ', '<svg width="'+size+'" height="'+size+'" style="flex-shrink:0" ');
}

// Classifier : stories Facebook → section séparée
function classify(link) {
  if (link.type === 'facebook' && link.subtype === 'story') return 'story';
  return link.type;
}

function buildStats(links) {
  var counts = {};
  links.forEach(function(l){ var c = classify(l); counts[c] = (counts[c]||0)+1; });
  var html = '<div class="stat"><div class="stat-val" style="color:var(--navy)">'+links.length+'</div><div class="stat-lbl">Total</div></div>';
  SECTION_ORDER.forEach(function(t){
    if (!counts[t]) return;
    html += '<div class="stat"><div class="stat-val" style="color:'+TYPE_COLORS[t]+'">'+counts[t]+'</div><div class="stat-lbl">'+(TYPE_LABELS[t]||t)+'</div></div>';
  });
  return '<div class="stats">'+html+'</div>';
}

function buildViz(links) {
  var counts = {};
  links.forEach(function(l){ var c = classify(l); counts[c] = (counts[c]||0)+1; });
  var max = Math.max.apply(null, Object.values(counts).concat([1]));
  var rows = SECTION_ORDER.filter(function(t){return counts[t];}).map(function(t){
    var pct = Math.round(counts[t]/max*100);
    return '<div class="viz-row"><div class="viz-label">'+ic(t,12)+' '+(TYPE_LABELS[t]||t)+'</div>'+
      '<div class="viz-bar-wrap"><div class="viz-bar" style="width:'+pct+'%;background:'+TYPE_COLORS[t]+'"></div></div>'+
      '<div class="viz-count">'+counts[t]+'</div></div>';
  }).join('');
  return '<div class="viz"><div class="viz-title">Répartition par source</div>'+rows+'</div>';
}

function buildAddForm() {
  return '<div class="add-form">' +
    '<div class="add-form-title">Ajouter un lien</div>' +
    '<div class="add-form-row">' +
      '<input class="add-input" id="addName" placeholder="Nom (optionnel)" type="text">' +
      '<input class="add-input url" id="addUrl" placeholder="https://…" type="url">' +
      '<button class="add-btn" id="addBtn" onclick="submitLink()">' +
        ic('add',13)+' Ajouter' +
      '</button>' +
    '</div>' +
    '<div class="add-msg" id="addMsg"></div>' +
  '</div>';
}

function buildCard(m) {
  var cls = classify(m);
  var preview = previewCache[m.id];
  var previewHTML = (preview && preview.image)
    ? '<div class="card-preview"><img src="'+preview.image+'" alt="" loading="lazy" onerror="this.parentNode.style.display=\'none\'"></div>'
    : '';
  var titleText = (preview && preview.title) ? preview.title
    : (m.source + (m.subtype && m.subtype !== 'story' ? ' — '+(SUBTYPE_LABELS[m.subtype]||m.subtype) : ''));
  var descHTML  = (preview && preview.description) ? '<div class="card-desc">'+preview.description+'</div>' : '';
  var subtypeHTML = (m.subtype && m.subtype !== 'story') ? '<div class="card-subtype">'+(SUBTYPE_LABELS[m.subtype]||m.subtype)+'</div>' : '';
  return '<div class="card '+cls+'" id="card-'+m.id+'">' +
    previewHTML +
    '<div class="card-head">' +
      '<div class="card-icon">'+ic(m.type,13)+'</div>' +
      '<div class="card-source-wrap"><div class="card-source">'+m.source+'</div>'+subtypeHTML+'</div>' +
    '</div>' +
    '<div class="card-body">' +
      '<div class="card-title">'+titleText+'</div>' +
      descHTML +
      '<div class="card-footer">' +
        '<span class="card-date">'+m.date+'</span>' +
        '<a class="card-link" href="'+m.url+'" target="_blank" rel="noopener">Voir '+ic('ext',11)+'</a>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function buildSections(links) {
  var groups = {};
  links.forEach(function(l){ var c = classify(l); if (!groups[c]) groups[c] = []; groups[c].push(l); });
  return SECTION_ORDER.filter(function(t){return groups[t] && groups[t].length;}).map(function(t){
    var items = groups[t];
    return '<div class="section '+t+'">' +
      '<div class="section-head">' +
        '<div class="section-icon">'+ic(t,16)+'</div>' +
        '<div class="section-title">'+(TYPE_LABELS[t]||t)+'</div>' +
        '<span class="section-count">'+items.length+'</span>' +
      '</div>' +
      '<div class="grid">'+items.map(buildCard).join('')+'</div>' +
    '</div>';
  }).join('');
}

function updateCardPreview(id) {
  var card = document.getElementById('card-'+id);
  if (!card) return;
  var m = allLinks.find(function(x){return x.id===id;});
  var p = previewCache[id];
  if (!p) return;
  if (p.image && !card.querySelector('.card-preview')) {
    card.insertAdjacentHTML('afterbegin','<div class="card-preview"><img src="'+p.image+'" alt="" loading="lazy" onerror="this.parentNode.style.display=\'none\'"></div>');
  }
  var t = card.querySelector('.card-title');
  if (t && p.title) t.textContent = p.title;
  var b = card.querySelector('.card-body');
  if (b && p.description && !b.querySelector('.card-desc')) {
    var t2 = b.querySelector('.card-title');
    if (t2) t2.insertAdjacentHTML('afterend','<div class="card-desc">'+p.description+'</div>');
  }
}

function loadPreviews(links) {
  var delay = 0;
  links.forEach(function(m){
    if (previewCache[m.id] !== undefined) return;
    (function(m, d){
      setTimeout(function(){
        fetch('https://api.microlink.io?url='+encodeURIComponent(m.url)+'&screenshot=false')
          .then(function(r){return r.json();})
          .then(function(data){
            previewCache[m.id] = (data.status==='success' && data.data) ? {
              title: data.data.title||null,
              description: data.data.description||null,
              image: (data.data.image && data.data.image.url) ? data.data.image.url : null
            } : null;
            updateCardPreview(m.id);
          })
          .catch(function(){ previewCache[m.id] = null; });
      }, d);
    })(m, delay);
    delay += 150;
  });
}

function render(links) {
  allLinks = links;
  var main = document.getElementById('main');
  main.innerHTML =
    buildAddForm() +
    buildStats(links) +
    buildViz(links) +
    buildSections(links);
  loadPreviews(links);
}

function submitLink() {
  var url  = (document.getElementById('addUrl').value || '').trim();
  var name = (document.getElementById('addName').value || '').trim();
  var msg  = document.getElementById('addMsg');
  var btn  = document.getElementById('addBtn');
  if (!url || !url.startsWith('http')) {
    msg.className = 'add-msg err'; msg.textContent = 'URL invalide.'; return;
  }
  btn.disabled = true; btn.textContent = 'Envoi…';
  msg.className = 'add-msg'; msg.textContent = '';
  var apiUrl = MEDIA_API_URL + '?action=addLink&url='+encodeURIComponent(url)+(name?'&name='+encodeURIComponent(name):'');
  fetch(apiUrl)
    .then(function(r){return r.text();})
    .then(function(t){
      var d; try { d = JSON.parse(t); } catch(e){ throw new Error('Réponse invalide'); }
      if (!d.success) throw new Error(d.message||'Erreur');
      msg.className = 'add-msg ok'; msg.textContent = 'Lien ajouté !';
      document.getElementById('addUrl').value = '';
      document.getElementById('addName').value = '';
      render(d.links || allLinks);
    })
    .catch(function(err){
      msg.className = 'add-msg err'; msg.textContent = 'Erreur : '+err.message;
    })
    .finally(function(){
      btn.disabled = false;
      btn.innerHTML = ic('add',13)+' Ajouter';
    });
}

// Chargement initial
fetch(MEDIA_API_URL)
  .then(function(r){ if (!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
  .then(function(t){
    var d; try { d = JSON.parse(t); } catch(e){ throw new Error('Réponse invalide'); }
    if (!d.success) throw new Error(d.message||'Erreur');
    render(d.links||[]);
  })
  .catch(function(err){
    document.getElementById('main').innerHTML =
      '<div class="error-box"><div style="font-size:32px;margin-bottom:12px">⚠️</div>'+
      '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:13px;color:var(--text3)">'+err.message+'</div>'+
      (MEDIA_API_URL==='VOTRE_URL_MEDIA_VEILLE_ICI'?'<div style="margin-top:10px;font-size:12px;color:var(--text3)">Renseignez MEDIA_API_URL dans media/index.html</div>':'')+
      '</div>';
  });
</script>
